<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b09">
  <meta name="description" content="GLORY HELPER — your personal AI assistant for ideas, answers, coding, and more.">
  <title>GLORY HELPER | AI Assistant</title>
  <style>
    :root {
      --bg: #070b09;
      --panel: rgba(16, 25, 21, .78);
      --panel-hover: rgba(21, 36, 28, .94);
      --line: rgba(133, 239, 181, .17);
      --green: #78efb1;
      --green-bright: #49e99a;
      --purple: #a6a1ff;
      --muted: #9baaa2;
      --white: #f4fbf7;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--white);
      background:
        radial-gradient(ellipse at 50% -12%, rgba(44, 139, 91, .19), transparent 48%),
        radial-gradient(ellipse at 94% 42%, rgba(111, 83, 197, .10), transparent 32%),
        radial-gradient(ellipse at 4% 78%, rgba(34, 155, 99, .08), transparent 35%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, a { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--green); outline-offset: 4px; }
    .shell { width: min(100% - 32px, 1050px); margin: 0 auto; }
    .topbar {
      min-height: 76px; display: flex; align-items: center; justify-content: space-between;
      gap: 16px; border-bottom: 1px solid rgba(255,255,255,.07);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center;
      color: var(--green); border: 1px solid rgba(120,239,177,.35);
      background: linear-gradient(145deg, rgba(120,239,177,.14), rgba(166,161,255,.08));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 0 24px rgba(73,233,154,.07);
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand-name { font-size: 15px; font-weight: 800; letter-spacing: .11em; }
    .brand-name span { color: var(--green); }
    .online { display: flex; align-items: center; gap: 8px; color: #a8d9bc; font-size: 12px; white-space: nowrap; }
    .online-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green-bright); box-shadow: 0 0 12px rgba(73,233,154,.8); }
    main { padding: 30px 0 0; }
    .chat-panel {
      position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 28px;
      background: linear-gradient(160deg, rgba(17,29,23,.92), rgba(9,15,12,.91) 58%, rgba(15,16,27,.91));
      box-shadow: 0 28px 90px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.045);
    }
    .panel-top {
      display: flex; align-items: center; justify-content: space-between; padding: 17px 20px;
      border-bottom: 1px solid rgba(255,255,255,.065); color: #aebbb4; font-size: 12px;
    }
    .panel-top-left { display: flex; align-items: center; gap: 9px; }
    .mini-orb { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px rgba(120,239,177,.7); }
    .panel-tools { display: flex; gap: 8px; }
    .icon-button {
      width: 32px; height: 32px; display: grid; place-items: center; color: #a6b7ad;
      background: rgba(255,255,255,.025); border: 1px solid rgba(255,255,255,.08); border-radius: 10px;
      cursor: pointer; transition: .2s ease;
    }
    .icon-button:hover { color: var(--green); border-color: var(--line); }
    .icon-button svg { width: 15px; height: 15px; }
    .welcome { text-align: center; padding: 28px 22px 18px; }
    .orb-wrap { width: 150px; height: 150px; position: relative; margin: 0 auto 15px; display: grid; place-items: center; }
    .orb-halo { position: absolute; inset: 3px; border-radius: 50%; background: conic-gradient(from 20deg, rgba(73,233,154,.05), rgba(73,233,154,.36), rgba(166,161,255,.35), rgba(73,233,154,.05)); filter: blur(17px); animation: breathe 5s ease-in-out infinite; }
    .orb {
      position: relative; width: 112px; height: 112px; border-radius: 50%;
      background:
        radial-gradient(circle at 32% 25%, rgba(226,255,239,.98) 0, rgba(120,239,177,.85) 8%, transparent 27%),
        radial-gradient(circle at 68% 70%, rgba(166,161,255,.85), transparent 35%),
        radial-gradient(circle at 42% 42%, #1b9564 0, #0e4b37 36%, #111a27 68%, #080d12 100%);
      box-shadow: inset -12px -15px 24px rgba(0,0,0,.52), inset 5px 5px 17px rgba(255,255,255,.17), 0 0 25px rgba(73,233,154,.18), 0 0 55px rgba(113,99,226,.12);
      border: 1px solid rgba(184,255,216,.42);
    }
    .orb::before, .orb::after { content: ""; position: absolute; border: 1px solid rgba(140,255,194,.48); border-radius: 50%; inset: -10px; transform: rotateX(66deg) rotateZ(-25deg); }
    .orb::after { inset: -17px; border-color: rgba(166,161,255,.32); transform: rotateX(68deg) rotateZ(38deg); }
    @keyframes breathe { 0%,100% { opacity: .65; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.05); } }
    .eyebrow { margin: 0 0 10px; color: var(--green); font-size: 10px; font-weight: 750; letter-spacing: .19em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 43px); line-height: 1.12; letter-spacing: -.045em; font-weight: 760; }
    .subtitle { max-width: 430px; margin: 12px auto 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
    .features { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; padding: 12px 22px 23px; }
    .feature {
      min-height: 128px; padding: 16px 14px; text-align: left; color: var(--white);
      border: 1px solid rgba(147,204,170,.15); border-radius: 17px;
      background: linear-gradient(145deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
      cursor: pointer; transition: transform .22s ease, border-color .22s ease, background .22s ease;
    }
    .feature:hover { transform: translateY(-3px); border-color: rgba(120,239,177,.48); background: var(--panel-hover); }
    .feature-icon { width: 35px; height: 35px; display: grid; place-items: center; margin-bottom: 14px; border-radius: 11px; background: rgba(120,239,177,.09); color: var(--green); }
    .feature:nth-child(even) .feature-icon { color: var(--purple); background: rgba(166,161,255,.10); }
    .feature-icon svg { width: 19px; height: 19px; }
    .feature-title { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .feature-desc { display: block; color: #8e9c94; font-size: 11px; line-height: 1.5; }
    .composer-wrap { padding: 0 22px 21px; }
    .composer {
      display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 7px 8px 7px 16px;
      border: 1px solid rgba(120,239,177,.28); border-radius: 17px;
      background: rgba(4,10,7,.72); box-shadow: 0 0 25px rgba(73,233,154,.045), inset 0 1px 0 rgba(255,255,255,.025);
    }
    .composer-placeholder { flex: 1; text-align: left; color: #7f9086; font-size: 13px; }
    .composer-hint { color: #5f7167; font-size: 10px; white-space: nowrap; }
    .send-button { width: 40px; height: 40px; border: 0; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(135deg, #8bf2b8, #43d98c); color: #06140c; cursor: pointer; box-shadow: 0 0 20px rgba(73,233,154,.15); }
    .send-button svg { width: 19px; height: 19px; }
    .composer-note { margin: 10px 2px 0; color: #68776e; font-size: 10px; text-align: center; }
    footer { padding: 17px 0 22px; }
    .footer-line { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 7px 12px; color: #87958d; font-size: 11px; text-align: center; }
    .footer-brand { color: #aebbb4; font-weight: 700; letter-spacing: .035em; }
    .footer-dot { color: #4c6255; }
    .footer-email { color: var(--green); text-decoration: none; }
    .footer-email:hover { text-decoration: underline; }
    .footer-year { color: #65736a; }
    @media (max-width: 650px) {
      .shell { width: min(100% - 20px, 520px); }
      .topbar { min-height: 66px; }
      .brand-mark { width: 37px; height: 37px; border-radius: 12px; }
      .brand-name { font-size: 13px; }
      .online { font-size: 10px; }
      main { padding-top: 15px; }
      .chat-panel { border-radius: 22px; }
      .panel-top { padding: 13px 14px; }
      .welcome { padding: 22px 15px 15px; }
      .orb-wrap { width: 122px; height: 122px; margin-bottom: 13px; }
      .orb { width: 90px; height: 90px; }
      .subtitle { font-size: 13px; }
      .features { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; padding: 10px 13px 17px; }
      .feature { min-height: 118px; padding: 13px 12px; }
      .feature-icon { margin-bottom: 11px; }
      .composer-wrap { padding: 0 13px 15px; }
      .composer { min-height: 54px; padding-left: 13px; }
      .composer-hint { display: none; }
      footer { padding-top: 15px; }
      .footer-line { gap: 6px 9px; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 3.5 14.2 9.8 20.5 12l-6.3 2.2L12 20.5l-2.2-6.3L3.5 12l6.3-2.2L12 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="m19 3 .7 2.3L22 6l-2.3.7L19 9l-.7-2.3L16 6l2.3-.7L19 3Z" fill="currentColor"/></svg>
        </div>
        <div class="brand-name">GLORY <span>HELPER</span></div>
      </div>
      <div class="online"><span class="online-dot"></span> AI ASSISTANT</div>
    </header>

    <main>
      <section class="chat-panel" aria-label="GLORY HELPER chat welcome">
        <div class="panel-top">
          <div class="panel-top-left"><span class="mini-orb"></span><span>Ready when you are</span></div>
          <div class="panel-tools">
            <button class="icon-button" type="button" aria-label="Start chatting" onclick="openChat()">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 20h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4 11.5-11.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
            </button>
            <button class="icon-button" type="button" aria-label="Open chat" onclick="openChat()">
              <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
            </button>
          </div>
        </div>

        <div class="welcome">
          <div class="orb-wrap" aria-hidden="true"><div class="orb-halo"></div><div class="orb"></div></div>
          <p class="eyebrow">YOUR PERSONAL AI ASSISTANT</p>
          <h1>What can I help with?</h1>
          <p class="subtitle">Ask anything. Let’s make something amazing.</p>
        </div>

        <div class="features">
          <button class="feature" type="button" onclick="openChat()">
            <span class="feature-icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4.5 4.5M8 11h6M11 8v6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
            <span class="feature-title">Explore the web</span><span class="feature-desc">Discover information</span>
          </button>
          <button class="feature" type="button" onclick="openChat()">
            <span class="feature-icon"><svg viewBox="0 0 24 24" fill="none"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="feature-title">Write code</span><span class="feature-desc">Build your ideas</span>
          </button>
          <button class="feature" type="button" onclick="openChat()">
            <span class="feature-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M9 18h6M10 21h4M8.5 14.5a6 6 0 1 1 7 0c-.8.6-1.2 1.2-1.3 2h-4.4c-.1-.8-.5-1.4-1.3-2Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="feature-title">Get ideas</span><span class="feature-desc">Think creatively</span>
          </button>
          <button class="feature" type="button" onclick="openChat()">
            <span class="feature-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M7 17.5A4.5 4.5 0 1 1 8 8.6a5.5 5.5 0 0 1 10.6 2A3.5 3.5 0 0 1 18 17.5H7Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 11v7m-2.5-2.5L12 18l2.5-2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="feature-title">Weather</span><span class="feature-desc">Check conditions</span>
          </button>
        </div>

        <div class="composer-wrap">
          <button class="composer" type="button" onclick="openChat()" aria-label="Open GLORY HELPER chat">
            <span class="composer-placeholder">Message GLORY HELPER...</span>
            <span class="composer-hint">Tap to start</span>
            <span class="send-button" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 19V5m-6 6 6-6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          </button>
          <p class="composer-note">GLORY HELPER can make mistakes. Check important information.</p>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-line">
        <span class="footer-brand">GLORY HELPER</span><span class="footer-dot">·</span>
        <span>Powered by Ambition</span><span class="footer-dot">·</span>
        <span>Created by Manthan Bhardwaj</span><span class="footer-dot">·</span>
        <a class="footer-email" href="mailto:manthanb745@gmail.com">manthanb745@gmail.com</a>
        <span class="footer-year">· 2026</span>
      </div>
    </footer>
  </div>

  <script>
    function openChat() {
      const selectors = [
        '#bp-web-widget-container button',
        'button.bpFab',
        'button[class*="fab"]',
        'button[class*="Fab"]'
      ];
      for (const selector of selectors) {
        const button = document.querySelector(selector);
        if (button) {
          button.click();
          return;
        }
      }
      alert('The chat is loading, or the widget button is not available yet. Please tap the Botpress chat icon in the bottom-right corner.');
    }
  </script>

    <!-- Botpress Integration -->
  <script src="https://cdn.botpress.cloud/webchat/v5.0/inject.js"></script>
  <script>
    window.botpressWebChat.init({
      "composerPlaceholder": "Message GLORY HELPER...",
      "botConversationDescription": "AI Assistant",
      "botId": "20261010170637-QPPVPPQ0",
      "hostUrl": "https://cdn.botpress.cloud/webchat/v5.0",
      "messagingUrl": "https://messaging.botpress.cloud",
      "clientId": "20261010170637-QPPVPPQ0",
      "lazyLoading": false,
      "showPoweredBy": false,
      "hideWidget": true
    });

    window.addEventListener('load', () => {
      if (window.botpressWebChat) {
        window.botpressWebChat.open();
      }
    });
  </script>

</html>
