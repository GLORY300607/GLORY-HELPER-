<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grok</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#0d0d0d; color:#ececec;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column;
  }
  header {
    height:56px; display:flex; align-items:center; justify-content:center;
    border-bottom:1px solid #2a2a2a; font-weight:600; font-size:17px; letter-spacing:.3px;
  }
  #chat { flex:1; overflow-y:auto; padding:24px 16px 12px; display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; max-width:760px; width:100%; margin:0 auto; }
  .row.user { justify-content:flex-end; }
  .bubble {
    max-width:78%; padding:12px 16px; border-radius:18px; line-height:1.55; font-size:15.5px;
    white-space:pre-wrap; word-wrap:break-word;
  }
  .row.user .bubble { background:#2f2f2f; border-bottom-right-radius:4px; }
  .row.bot .bubble { background:#1a1a1a; border:1px solid #2a2a2a; border-bottom-left-radius:4px; }
  .typing { display:inline-flex; gap:5px; padding:4px 2px; }
  .typing span { width:7px; height:7px; background:#8a8a8a; border-radius:50%; animation:blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s; } .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25} 40%{opacity:1} }
  footer { border-top:1px solid #2a2a2a; padding:12px 16px 16px; background:#0d0d0d; }
  .composer { max-width:760px; margin:0 auto; display:flex; gap:10px; align-items:flex-end; }
  textarea {
    flex:1; resize:none; background:#1a1a1a; border:1px solid #333; color:#ececec;
    border-radius:22px; padding:12px 16px; font-size:15.5px; line-height:1.4; max-height:160px; outline:none;
  }
  textarea:focus { border-color:#555; }
  button {
    width:44px; height:44px; border-radius:50%; border:none; background:#ececec; color:#0d0d0d;
    font-size:20px; cursor:pointer; flex-shrink:0;
  }
  button:disabled { opacity:.35; cursor:default; }
  .hint { text-align:center; color:#6a6a6a; font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<header>Grok</header>
<div id="chat"></div>
<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message Grok..."></textarea>
    <button id="send" title="Send">&#10148;</button>
  </div>
  <div class="hint">AI can make mistakes. Check important info.</div>
</footer>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function addMsg(text, who) {
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = text;
  row.appendChild(b);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return b;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'row bot';
  row.id = 'typing';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  row.appendChild(b);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function hideTyping() { const t = document.getElementById('typing'); if (t) t.remove(); }

// ---------- DEMO BRAIN (replace with a real API call) ----------
async function getReply(text) {
  await new Promise(r => setTimeout(r, 700 + Math.random() * 800));
  const t = text.toLowerCase();
  if (/hello|hi|hey/.test(t)) return "Hey! I'm Grok. Ask me anything — history, science, code, whatever's on your mind.";
  if (/who (are|r) you|what (are|r) you/.test(t)) return "I'm Grok, an AI assistant built by SpaceXAI. I aim to be direct, curious, and useful.";
  if (/weather/.test(t)) return "I can't check live weather from this demo. Wire me to a weather API and I will.";
  if (/joke/.test(t)) return "Why do programmers prefer dark mode? Because light attracts bugs.";
  if (/help/.test(t)) return "Just type a question. I can explain concepts, write code, brainstorm, or chat.";
  if (/\?$/.test(text.trim())) return "Good question — in this demo I only know a handful of canned replies. Connect a real model API and every question gets a real answer.";
  return "Interesting. This page is a working chat shell — the brain is still the demo. Swap getReply() for an API call (OpenAI, Anthropic, xAI, etc.) and it answers like the real thing.";
}
// --------------------------------------------------------------

async function handleSend() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  addMsg(text, 'user');
  sendBtn.disabled = true;
  showTyping();
  try {
    const reply = await getReply(text);
    hideTyping();
    addMsg(reply, 'bot');
  } catch (e) {
    hideTyping();
    addMsg('Something went wrong: ' + e.message, 'bot');
  }
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener('click', handleSend);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});
</script>
</body>
</html>
